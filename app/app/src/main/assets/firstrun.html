<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>鲸聊</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    background:#ededed; color:#191919; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:28px; }
  .logo { width:88px; height:88px; border-radius:22px; background:#07c160;
    display:flex; align-items:center; justify-content:center; }
  .logo svg { width:48px; height:48px; color:#fff; }
  h1 { font-size:20px; font-weight:600; }
  p { font-size:14px; color:#8a8a8a; text-align:center; line-height:1.6; }
  .btn { width:230px; height:48px; border:none; border-radius:12px; background:#07c160;
    color:#fff; font-size:16px; font-weight:600; margin-top:8px; }
  .btn:active { background:#06ad56; }
  .divider { display:flex; align-items:center; gap:10px; width:260px; color:#8a8a8a; font-size:12px; }
  .divider::before,.divider::after { content:""; flex:1; height:0.5px; background:rgba(0,0,0,.08); }
  .row { display:flex; gap:8px; width:260px; }
  .row input { flex:1; height:42px; border:none; outline:none; background:#fff; border-radius:10px;
    font-size:14px; padding:0 12px; color:#191919; }
  .row button { height:42px; padding:0 16px; border:none; border-radius:10px; background:#07c160;
    color:#fff; font-size:14px; }
  .err { color:#d0392b; font-size:13px; display:none; }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </div>
  <h1>鲸聊</h1>
  <p>像微信一样给电脑上的智能体发消息<br>首次使用请扫描电脑上的配对二维码</p>
  <button class="btn" onclick="scan()">扫一扫连接</button>
  <div class="divider">或手动输入电脑地址</div>
  <div class="row">
    <input id="addr" type="text" placeholder="如 192.168.1.10:3080">
    <button onclick="connect()">连接</button>
  </div>
  <div class="err" id="err">地址格式不对</div>

<script>
function showErr() { document.getElementById('err').style.display = 'block'; }

function connect() {
  var v = document.getElementById('addr').value.trim();
  if (v === '') return;
  if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
  var u;
  try { u = new URL(v); } catch (e) { showErr(); return; }
  try { WechatBridge.saveOrigin(u.origin); } catch (e) {}
  location.href = u.origin + '/wechat';
}

function scan() {
  try {
    if (window.WechatBridge && typeof window.WechatBridge.scanQR === 'function') {
      WechatBridge.scanQR();
      return;
    }
  } catch (e) {}
  showErr();
}

/* 扫码结果回来（安卓原生扫码后回调）：直接打开配对链接，
   服务器校验令牌→下发设备 cookie→跳回聊天页（与原插件同款导航式配对）。 */
function wechatOnScanResult(url) {
  if (typeof url !== 'string' || url === '') { showErr(); return; }
  var u;
  try { u = new URL(url); } catch (e) { showErr(); return; }
  try { WechatBridge.saveOrigin(u.origin); } catch (e) {}
  location.href = url;
}
</script>
</body>
</html>
