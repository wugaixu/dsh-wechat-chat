plugins {
    id 'com.android.application'
}

// 读取讯飞密钥：secrets.properties（本地，不提交）优先，否则回退到 example 模板
def secretsFile = file('secrets.properties')
def secrets = new Properties()
if (secretsFile.exists()) {
    secrets.load(new FileInputStream(secretsFile))
} else {
    def ex = file('secrets.properties.example')
    if (ex.exists()) secrets.load(new FileInputStream(ex))
}
def IFLYTEK_APP_ID = secrets.getProperty('IFLYTEK_APP_ID', 'your_app_id')
def IFLYTEK_API_KEY = secrets.getProperty('IFLYTEK_API_KEY', 'your_api_key')
def IFLYTEK_API_SECRET = secrets.getProperty('IFLYTEK_API_SECRET', 'your_api_secret')

android {
    namespace 'com.dsh.wechat'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.dsh.wechat"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
        buildConfigField "String", "IFLYTEK_APP_ID", "\"${IFLYTEK_APP_ID}\""
        buildConfigField "String", "IFLYTEK_API_KEY", "\"${IFLYTEK_API_KEY}\""
        buildConfigField "String", "IFLYTEK_API_SECRET", "\"${IFLYTEK_API_SECRET}\""
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Align kotlin stdlib so stdlib-jdk8 doesn't duplicate classes with stdlib 1.8.22
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    // 头像/背景裁剪旋转（androidx 原生版，避免旧 support 库冲突）
    implementation 'com.github.yalantis:ucrop:2.2.8-native'
    // 讯飞语音听写：直接用 WebSocket + 系统网络栈（OkHttp）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
